name: cabane-ha-dev

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.10.0
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - config:/config
      - ./configuration.yaml:/config/configuration.yaml:ro
    environment:
      TZ: Europe/Paris
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123/', timeout=5)"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

volumes:
  config:
